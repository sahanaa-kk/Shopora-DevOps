
services:
  mongo:
    container_name: shopora-complete-mongo
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: shopora-complete-backend
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "5001:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/shopora
      PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    container_name: shopora-complete-frontend
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  mongo_data:
